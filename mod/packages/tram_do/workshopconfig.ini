$ITEM_NAME "Tram Distribution Office [1.1.1.9]"

$ITEM_DESC "[h1]COMRADE, THE TRAMS WILL NOW RUN TO PLAN.[/h1]
Your cargo trams have stood in the depot long enough, waiting for someone to tell them where to go. The Ministry of Municipal Transport has opened a dispatch office.

[img]https://raw.githubusercontent.com/aislanfoina/wrsr-tramdo/main/docs/images/yard_large.jpg[/img]

[b]Tram Distribution Office[/b] does for cargo trams what the game's distribution offices do for trucks and trains: it buys and keeps the trams, takes loading and unloading stations as tasks, and sends a tram whenever a station has goods to move, with no fixed routes to set.

[h2]TWO YARDS[/h2]
[list]
[*][b]Tram Distribution Office (small trams)[/b]: the game's tram end station layout, [b]6 parking lanes[/b] of 38 m under a shed: up to 6 tram sets of up to [b]30 m[/b] (the small and medium sets).
[*][b]Tram Distribution Office (large trams)[/b]: the game's big tram depot layout with longer lanes, [b]8 parking lanes[/b] of 50 m: up to 8 tram sets of any length.
[/list]
Both unlock with the [b]Railway distribution office[/b] research. They have a brick tram shed, the ТРАМГРУЗ dispatch wing, a traction substation and a sand tower. The game lays the yard's track and trolley wire itself, as with its own depots.

[h2]HOW TO RUN IT[/h2]
[olist]
[*]Subscribe to this item and to [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3787969749]Republic Mod Loader[/url]. You also need cargo trams, for example the [url=https://steamcommunity.com/workshop/filedetails/?id=3586298879]cargo tram collection[/url] this office was built and tested with.
[*]Run Republic Mod Loader, enable this item and its [b]tramdo[/b] plugin, and launch.
[*]Build the office on your tram network, buy cargo trams in its window (or move trams in), and give it tasks like any distribution office: the tram cargo stations to load at and to unload at.
[/olist]
Requires Workers & Resources: Soviet Republic [b]1.1.1.9[/b]: the plugin patches this exact build.

[h2]GOOD TO KNOW[/h2]
[list]
[*]Cargo trams only: passenger trams stay with the tram depot.
[*]Each parking lane holds one tram set: when every lane is taken the office is full.
[*]Gravel, fluids and other bulk goods leave an unloading tram station by conveyor or pipe. Run the conveyor [b]straight into the storage[/b]: with a conveyor transfer building in between, the office sees the transfer as full and keeps the trams at home. The yellow 'unsupported with unloading' note on such stations can be ignored.
[*]Station thresholds work as with trucks: a station set to dispatch only at 20% gets no tram before that.
[*]The plugin runs the office's planning with fuel off (trams are electric, the game's office would wait forever to refuel them) and lets only cargo trams in. Without the plugin the offices take no trams at all.
[/list]

[h2]STATUS[/h2]
Tested with open, covered, aggregate and waste trams. Fluid trams should work the same way but have not been tried yet. Reports are welcome on GitHub or below.

[h2]LICENCE AND CREDITS[/h2]
GPL-3.0, source code on GitHub: [url=https://github.com/aislanfoina/wrsr-tramdo]https://github.com/aislanfoina/wrsr-tramdo[/url]. The plugin builds against TesmioLoader by MaxLegend and runs on [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3787969749]Republic Mod Loader[/url] by UltimateUniverse. The cargo trams themselves come from other authors' mods; this office only runs them.

Workers & Resources: Soviet Republic is (c) 3Division. This is an independent fan-made mod, not affiliated with or endorsed by 3Division or Hooded Horse."

