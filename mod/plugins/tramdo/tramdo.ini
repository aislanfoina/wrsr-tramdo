; tramdo - the tram distribution office. UTF-8, no BOM.
;
; enabled        1 = run, 0 = the plugin does nothing (the offices then refuse trams)
; object_prefix  buildings whose object name starts with this are tram offices: they take cargo
;                vehicles of the "tram" train group (not passenger trams), and only those
; log_decisions  how many admit/refuse decisions to write to the loader log (for testing)
; research       the research the offices wait for besides distribution_office (the road
;                office's own); empty = none. Default: the railway distribution office's.
; limit_<object> the longest tram set (metres, the tram plus its $TRAINSET wagons, as the game
;                measures trains) that office takes; offices without a line take every length.
;                Small and medium cargo tram sets run 21-26 m, the large ones 35-41 m.

[tramdo]
enabled = 1
object_prefix = tramdo
log_decisions = 40
research = railway_distribution_office
limit_tramdo_small = 30
